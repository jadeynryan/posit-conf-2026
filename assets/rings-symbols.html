<!-- The rings graphic, as reusable SVG symbols, one per layer, for the {{< rings >}} shortcode
     (_extensions/rings/rings.lua). Generated. Three evenly spaced rings echoing the animated playbook diagram
     (assets/rings.js; r=80, 180, 280 in a 600 box); each person is a dot so it
     stays crisp at any size: centre 1, ring 2 12, ring 3 24. Colours come from the CSS `color` on
     each <use class="ring-N"> in assets/rings.css, via currentColor; unlit rings are grey there.
     Loaded once via include-after-body (_quarto.yml); <use href="#rings-lN"> works anywhere in the document. -->
